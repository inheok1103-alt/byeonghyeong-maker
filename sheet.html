<html lang="ko">
<head>

<title>Ray English · 분석지 생성기</title>
<style>
/* ===== Ray English 분석지 생성기 — 정본 디자인(A4 가로 2쪽 · 색=기능 6색 · 1-3-5) 웹 이식 =====
   입력 UI는 다크, 결과물은 정본 분석지 그대로. 엔진: api_team(프록시 내장키). */
:root{
  --blue:#2563EB; --green:#16845B; --amber:#B45309; --rose:#C0265A; --purple:#6D45B8;
  --gray:#59616E; --navy:#142A63; --line:#D8DEE8; --paper:#FBFAF7; --warn:#FBEAEC; --ok:#EAF5EF;
  --bgblue:#EAF1FF; --bggreen:#E5F3EC; --bgamber:#FBEFE1; --bgrose:#FBE7EE; --bgpurple:#EFE9FB;
  --dbg:#0f1117; --dcard:#171a22; --dline:#2a2f3d; --dink:#e9ebf2; --dsoft:#9aa1b2; --gold:#C8A96A; --gold2:#EAD199;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dbg);color:var(--dink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;padding:20px 12px 60px}
.wrap{max-width:1160px;margin:0 auto}
.top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.seal{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:19px;color:var(--gold);background:linear-gradient(145deg,#262a38,#141721);border:1px solid var(--dline)}
.top b{font-size:17px}.top b i{color:var(--gold);font-style:normal}
.top .sub{font-size:10.5px;color:var(--dsoft);letter-spacing:.1em;text-transform:uppercase}
.top a{margin-left:auto;font-size:12px;color:var(--dsoft);text-decoration:none;border:1px solid var(--dline);border-radius:9px;padding:6px 11px}
.top a:hover{color:var(--gold);border-color:var(--gold)}
.raynav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.raynav a{flex:1 1 auto;min-width:76px;text-align:center;text-decoration:none;font-size:13.5px;font-weight:700;color:#9aa1b2;background:#1c202b;border:1px solid #2a2f3d;border-radius:11px;padding:10px 8px;transition:.12s;white-space:nowrap}
.raynav a:hover{border-color:#C8A96A;color:#EAD199}
.raynav a.active{background:linear-gradient(180deg,#EAD199,#C8A96A);color:#1a1508;border-color:#C8A96A;box-shadow:0 2px 10px rgba(200,169,106,.25)}
.raynav a small{display:block;font-size:9.5px;font-weight:500;opacity:.72;margin-top:1px}
.card{background:var(--dcard);border:1px solid var(--dline);border-radius:14px;padding:16px;margin:12px 0}
textarea{width:100%;min-height:130px;background:#0d0f16;border:1px solid var(--dline);border-radius:11px;color:var(--dink);font-size:.95rem;line-height:1.6;padding:12px;resize:vertical;font-family:inherit}
textarea:focus{outline:2px solid rgba(200,169,106,.35);border-color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font-family:inherit;cursor:pointer}
.gh{background:#1c202b;border:1px solid var(--dline);color:#c7cbd8;border-radius:9px;font-size:.8rem;font-weight:600;padding:7px 12px}
.gh:hover{border-color:var(--gold);color:var(--gold2)}
input[type=text]{background:#1c202b;border:1px solid var(--dline);color:var(--dink);border-radius:8px;font-size:.8rem;padding:6px 9px;font-family:inherit}
.go{background:linear-gradient(180deg,var(--gold2),var(--gold));border:0;color:#1a1508;font-weight:800;font-size:.95rem;border-radius:11px;padding:12px 24px}
.go:disabled{filter:grayscale(.7);opacity:.6;cursor:wait}
.prog{font-size:.8rem;color:#43c59e;margin-top:8px;white-space:pre-wrap}
.note{font-size:.8rem;color:var(--dsoft)}
/* ===== 분석지(정본) ===== */
@page{size:A4 landscape;margin:0}
.page{width:297mm;min-height:210mm;background:var(--paper);color:#1d2430;margin:8mm auto;padding:11mm 12mm 9mm;position:relative;overflow:hidden;page-break-after:always;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.en{font-family:"Source Serif 4","Times New Roman",serif;font-size:10.4pt;line-height:1.5}
.ko{font-size:8.7pt;color:var(--gray);line-height:1.35}
h1.title{font-size:15pt;font-weight:700;color:var(--navy);letter-spacing:-.2px}
h2.sec{font-size:9.6pt;font-weight:700;color:var(--navy);margin-bottom:1.5mm;padding-bottom:.6mm;border-bottom:1.4px solid var(--navy);display:flex;gap:2mm;align-items:center}
h2.sec small{font-weight:500;color:var(--gray);font-size:7.6pt}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--navy);padding-bottom:2mm}
.head .meta{font-size:7.6pt;color:var(--gray);letter-spacing:.3px}
.head .brand{font-size:8pt;font-weight:700;color:var(--navy);text-align:right}
.head .brand b{color:var(--rose)}
.thesis{margin-top:2mm;font-size:8.8pt;background:var(--ok);border-left:3px solid var(--green);padding:1.6mm 3mm;border-radius:0 2mm 2mm 0;color:#1d2430}
.thesis b{color:var(--navy)}
.key{display:flex;gap:3mm;margin:2mm 0 2.5mm;flex-wrap:wrap;font-size:7.5pt;color:#1d2430}
.key span{display:inline-flex;align-items:center;gap:1.3mm}
.dot{width:3mm;height:3mm;border-radius:50%;display:inline-block}
.hl{padding:0 .6mm;border-radius:1px;font-weight:600}
.c-blue{color:var(--blue);background:var(--bgblue)} .c-green{color:var(--green);background:var(--bggreen)}
.c-amber{color:var(--amber);background:var(--bgamber)} .c-rose{color:var(--rose);background:var(--bgrose)}
.c-purple{color:var(--purple);background:var(--bgpurple)}
.sents{margin-top:1mm}
.srow{display:grid;grid-template-columns:6mm 1fr 52mm;gap:2.4mm;padding:1.5mm 0;border-bottom:.5px dashed var(--line);break-inside:avoid;page-break-inside:avoid}
.dense .srow{padding:1mm 0}.dense .en{font-size:9.4pt;line-height:1.42}.dense .ko{font-size:8pt}.dense .side{font-size:7.2pt}
.num{font-weight:700;color:#fff;background:var(--navy);border-radius:50%;width:5mm;height:5mm;display:flex;align-items:center;justify-content:center;font-size:7.6pt}
.srow .mid .ko{margin-top:.6mm}
.srow .side{font-size:7.6pt;color:#2b3340}
.role{display:inline-block;font-weight:700;color:var(--navy);font-size:7.4pt;border:1px solid var(--line);border-radius:2mm;padding:.2mm 1.4mm;margin-bottom:.5mm}
.side .pt b{color:var(--rose)}
.strip{display:grid;grid-template-columns:1fr 86mm;gap:3mm;margin-top:2.5mm}
.box{border:1px solid var(--line);border-radius:2mm;padding:2mm 2.6mm;background:#fff;color:#1d2430}
.flow{display:flex;flex-direction:column;gap:1mm}
.flow .step{font-size:7.5pt;padding:.9mm 2mm;border-radius:1.5mm;line-height:1.25}
.flow .arrow{text-align:center;color:var(--gray);font-size:6.5pt;line-height:.6}
.exam4{display:grid;grid-template-columns:1fr 1fr;gap:1.6mm}
.exam4 .cell{border:1px solid var(--line);border-radius:1.5mm;padding:1.4mm 2mm;font-size:7.4pt;line-height:1.3}
.exam4 .cell .ty{font-weight:700;color:var(--purple);display:block;margin-bottom:.4mm}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:2mm;color:#1d2430}
.sum li{list-style:none;font-size:8.4pt;line-height:1.42;margin-bottom:1.1mm;padding-left:18mm;position:relative}
.sum li b{position:absolute;left:0;width:16mm;color:var(--navy);font-size:7.8pt}
.titlecand{margin-top:1mm;font-size:7.8pt;color:var(--purple);font-weight:600}
table.vocab{width:100%;border-collapse:collapse;font-size:7.5pt;color:#1d2430}
table.vocab th,table.vocab td{border:.5px solid var(--line);padding:1mm 1.6mm;text-align:left;vertical-align:top;line-height:1.3}
table.vocab th{background:#f3f1ec;color:var(--navy);font-weight:700;font-size:7.2pt}
table.vocab td .s{font-family:"Source Serif 4",serif;font-weight:600}
table.vocab td .t{color:var(--green)}
.tag{font-size:6.8pt;color:#fff;background:var(--gray);border-radius:1mm;padding:.1mm 1mm}
.loop .item{font-size:7.7pt;line-height:1.35;margin-bottom:1.3mm;padding:1.3mm 2mm;border-left:2.5px solid var(--purple);background:var(--bgpurple);border-radius:0 1.5mm 1.5mm 0;color:#1d2430}
.loop .item b{color:var(--purple)}
.review{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2mm;margin-top:1mm}
.review .rcard{border-radius:1.5mm;padding:1.4mm 2mm;font-size:7.5pt;line-height:1.32}
.review .memo{background:var(--ok);border:1px solid #bfe3cf}
.review .key2{background:#fff;border:1px solid var(--line)}
.review .trap{background:var(--warn);border:1px solid #f0cdd3}
.review .rcard .h{font-weight:700;font-size:7.2pt;display:block;margin-bottom:.6mm}
.review .memo .h{color:var(--green)} .review .trap .h{color:var(--rose)} .review .key2 .h{color:var(--blue)}
.folio{position:absolute;bottom:4mm;right:12mm;font-size:7pt;color:var(--gray)}
.folioL{position:absolute;bottom:4mm;left:12mm;font-size:7pt;color:var(--gray)}
@media print{ body{background:#fff;padding:0} .noprint{display:none!important} .page{margin:0;box-shadow:none} }
@media(max-width:900px){ .page{transform-origin:top left;transform:scale(.55);margin-bottom:calc(-210mm*.45)} }
</style>

<script>
var RAY_PROXY="https://ray-proxy.gen1103.workers.dev";
var T=window.APITEAM; T.configure({proxyUrl:RAY_PROXY});
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
/* 위생: 깨진 문자(U+FFFD)·키릴 혼입·제어문자 제거 — 전 문자열 깊이 청소 */
function clean(o){ if(typeof o==="string") return o.replace(/[\uFFFD\u0400-\u04FF]/g,"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  if(Array.isArray(o)) return o.map(clean); if(o&&typeof o==="object"){var r={};Object.keys(o).forEach(function(k){r[k]=clean(o[k]);});return r;} return o; }
/* 문장 분리(코드가 진실원본 — LLM 분할·중복 오류 차단) */
function splitSents(pg){ var m=String(pg).replace(/\s+/g," ").trim().match(/[^.!?]+[.!?]+["')\]]*/g)||[String(pg)];
  var out=[]; m.forEach(function(s){ s=s.trim(); if(out.length&&(s.split(/\s+/).length<3||/^[a-z]/.test(s))) out[out.length-1]+=" "+s; else out.push(s); }); return out; }
function P(m){document.getElementById("prog").textContent=m;}
function loadSample(){document.getElementById("passage").value="What are the relations between social determinations and subjective aesthetic experience? If every author comes out with his own set of values and personal history, how is this subjective vision of the world influenced by the society in which the author lives? The inner world of the writer necessarily meets the social world outside of him or her. Pierre Bourdieu tries to answer this question from a materialistic point of view, saying that the analysis of this relation must go back to the earliest stage of a child's life when he experiences pleasure and aversion. But children are already part of a social group thanks to their family, and therefore the pleasure and the aversion they experience are class-specific, so that the purest pleasures are rooted in these socially conditioned experiences. In other words, for Bourdieu, from the beginning of life, every experience is already conditioned by the world outside, and this influence manifests itself in literary works too.";}

/* ── 하이라이트: LLM이 준 구절을 문장 안에서 찾아 기능색 span으로 감쌈(없으면 무시 — 검증 게이트) ── */
function applyHl(en, hls){
  var html=esc(en);
  (hls||[]).forEach(function(h){
    if(!h||!h.t||!/^(blue|green|amber|rose|purple)$/.test(h.c||"")) return;
    var t=esc(h.t).trim(); if(t.length<2) return;
    var i=html.indexOf(t); if(i<0) return;                       // 원문에 실존하는 구절만
    if(/class="hl/.test(html.slice(Math.max(0,i-40),i))) return; // 중첩 방지(근사)
    html=html.slice(0,i)+'<span class="hl c-'+h.c+'">'+t+'</span>'+html.slice(i+t.length);
  });
  return html;
}
var STAR="★★☆☆|★★★☆|★★★★"; function diffStar(d){d=parseInt(d,10)||3;return ["★☆☆☆","★★☆☆","★★★☆","★★★★"][Math.min(4,Math.max(1,d))-1];}

async function makeSheet(){
  var pg=document.getElementById("passage").value.trim();
  if(pg.split(/\s+/).length<30){alert("지문이 너무 짧습니다(30단어 이상).");return;}
  var btn=document.getElementById("goBtn");btn.disabled=true;P("🧠 분석 중… (문장분석 + 시험정리 2엔진 병렬)");
  var SENTS=splitSents(pg);
  var NUM=SENTS.map(function(s,i){return "S"+(i+1)+": "+s;}).join("\n");
  var SYS=[{role:"system",content:"너는 한국 고등 영어 내신 1타 분석가다. 지문을 문장 단위로 해부해 '분석지' 데이터를 만든다. 색은 독해 기능이다: blue=핵심개념, green=조건·근거·배경, amber=논리신호·전환, rose=문법·구문, purple=주장·출제핵심. 반드시 JSON만 출력."}];
  try{
    var sentsP=T.llmJSON(SYS.concat([{role:"user",content:"[지문 문장 — 번호 고정]\n"+NUM+"\n\n문장별 분석 JSON: {\"title\":\"한국어 제목(소재—논지)\",\"issue\":\"핵심 쟁점 1문장(한국어, 굵힐 곳은 **표시**)\",\"genre\":\"지문 성격(예: 사회과학 설명문)\",\"diff\":1~4,\"sents\":[{\"n\":1,\"ko\":\"자연스러운 해석\",\"role\":\"담화 역할(질문 제기/중심 명제/근거/예시/역접 전환/재진술·결론 등 2~6자)\",\"pt\":\"출제 포인트 한 줄(어법·빈칸·함정, 굵힐 곳 **표시**)\",\"hl\":[{\"t\":\"그 문장에 실제로 있는 원문 구절 그대로(2~6단어)\",\"c\":\"blue|green|amber|rose|purple\"}]}],\"flow\":[{\"t\":\"① 단계 요약\",\"c\":\"blue|green|amber|purple\"}](정확히 3~4단계),\"exam4\":[{\"ty\":\"주제·제목\",\"body\":\"근거 S번호+예상 함정\"},{\"ty\":\"빈칸\",\"body\":\"..\"},{\"ty\":\"순서·삽입\",\"body\":\"..\"},{\"ty\":\"어법\",\"body\":\"..\"}]} — sents는 S1~S"+SENTS.length+"과 정확히 1:1("+SENTS.length+"개, n 오름차순), hl은 문장당 1~3개·해당 문장에 실존하는 구절만. JSON만."}]),{temperature:0.3,timeout:90000});
    var wrapP=T.llmJSON(SYS.concat([{role:"user",content:"[지문]\n"+pg+"\n\n시험정리 JSON: {\"summary\":{\"주제\":\"..\",\"목적\":\"..\",\"요지\":\"..\",\"주장\":\"..\"},\"titles\":[\"영어 제목 후보1\",\"후보2\"],\"loop\":[{\"k\":\"빈칸\",\"task\":\"서술형 전환 과제\",\"rubric\":\"채점 기준\"},{\"k\":\"어법\",\"task\":\"..\",\"rubric\":\"..\"},{\"k\":\"서술형\",\"task\":\"..\",\"rubric\":\"..\"}],\"review\":{\"memo\":\"암기할 원문 핵심 문장 1개(영어)\",\"keys\":\"핵심어 4개(· 구분)\",\"traps\":\"함정 2개(① ② 형식)\"},\"para\":[{\"s\":\"원문 어구 그대로(3~6단어, 문장 전체 금지)\",\"t\":\"영어 치환 표현\",\"tag\":\"주제|제목|요지|빈칸|어법|어휘|함축 중\"}](6~7행, 예: {\"s\":\"social determinations\",\"t\":\"external social forces\",\"tag\":\"주제·빈칸\"}),\"trapwords\":[{\"w\":\"단어 (품사)\",\"mean\":\"지문에서의 뜻(한국어)\",\"trap\":\"혼동 단어·오독(한국어/영어)\"}](3~4행),\"anchor\":\"정답 근거 한 줄 — 반드시 S번호 포함(예: 주제·요지·빈칸의 정답은 모두 **S6**으로 수렴한다...)\"} — 전부 이 지문 근거로만. loop의 task는 구체적으로(예: \"S6의 핵심 개념을 영어 10~15단어로 바꿔 쓰시오\"), rubric은 채점 포인트(예: \"shaped by external society 의미 유지 시 만점, 시제 오류 -1\"). JSON만."}]),{temperature:0.3,timeout:90000});
    var r=await Promise.all([sentsP,wrapP]); var A=clean(r[0]),B=clean(r[1]);
    if(!A||!A.sents||!A.sents.length||!B||!B.summary) throw new Error("분석 결과 불완전 — 다시 시도해주세요");
    A.sents=A.sents.slice(0,SENTS.length); while(A.sents.length<SENTS.length)A.sents.push({});  // 코드 분리가 진실원본
    render(A,B,SENTS,pg); P("✅ 완료 — 인쇄/PDF 저장 버튼으로 실물 출력");
    document.getElementById("prBtn").style.display="";
  }catch(e){ P("⚠ "+(e&&e.message||e)); }
  btn.disabled=false;
}
function bold(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");}
function render(A,B,SENTS,pg){
  var meta=esc(A.genre||"")+" · 난도 "+diffStar(A.diff)+" · "+SENTS.length+"문장"+(document.getElementById("srcMeta").value?" · "+esc(document.getElementById("srcMeta").value):"");
  var h="";
  /* ── PAGE 1: 본문 분석 ── */

  (A.exam4||[]).slice(0,4).forEach(function(c){ h+='<div class="cell"><span class="ty">'+esc(c.ty||"")+'</span>'+esc(c.body||"")+'</div>'; });

  /* ── PAGE 2: 시험 정리 ── */
  h+='<section class="page"><div class="head"><div><div class="meta">'+meta+'</div><h1 class="title">시험 정리 — 요약 · 어휘 · 변형 루프</h1></div><div class="brand">Ray\'s <b>English</b><br><span style="font-weight:500;color:var(--gray)">시험 정리 · Page 2 / 2</span></div></div>';

  (B.loop||[]).forEach(function(l){ h+='<div class="item"><b>'+esc(l.k||"")+'</b> '+esc(l.task||"")+' <span style="color:var(--gray)">채점: '+esc(l.rubric||"")+'</span></div>'; });
  h+='</div><h2 class="sec" style="margin-top:3mm">복습 카드 <small>30초 회독</small></h2><div class="review">';

  h+='</div></div><div>';

  var pgL=pg.toLowerCase();
  var paraOK=(B.para||[]).filter(function(p){ var s=String(p.s||"").trim(); return s&&s.split(/\s+/).length<=8&&pgL.indexOf(s.toLowerCase().slice(0,28))>=0&&/[a-z]/i.test(p.t||""); });
