name: 뇌 24시간 자가학습·회의

on:
  schedule:
    - cron: '13 * * * *'      # 매시간(UTC 기준 13분) 자동 실행 — PC/탭 꺼져도 GitHub 서버가 돌림
  workflow_dispatch: {}        # 수동 실행 버튼(Actions 탭)

permissions:
  contents: write              # 레포에 커밋할 권한(GitHub 자동 토큰 사용, PAT 불필요)

concurrency:
  group: brain-loop
  cancel-in-progress: false

jobs:
  learn-and-meet:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 자가학습 + 교사 회의 실행
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # 암호화 Secret에서 주입(공개 레포엔 노출 안 됨)
        run: node self_learn_server.js || true

      - name: 결과 커밋
        run: |
          git config user.name "brain-bot"
          git config user.email "brain-bot@users.noreply.github.com"
          git add corpus/learned_rules.json corpus/self_samples.json corpus/live_meetings.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "🧠 자동 자가학습·회의(GitHub Actions) $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
