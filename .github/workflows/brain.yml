# 24시간 출제자 뇌 — 공개 레포에서 GitHub Actions 무료·무제한
# 주의: schedule은 혼잡 시 수 분~수십 분 지연될 수 있음(무료 특성).
#       매시 봇 커밋이 저장소 활동으로 기록되므로 '60일 무활동 시 schedule 자동 비활성' 규정을 자연 회피함.
name: 24h-brain
on:
  schedule:
    - cron: '17 * * * *'        # 매시 17분(정각 혼잡 회피)
  workflow_dispatch:             # 수동 실행
  repository_dispatch:           # (선택) GAS가 PAT로 즉시 트리거할 때
    types: [user-request]
permissions:
  contents: write
concurrency:
  group: brain
  cancel-in-progress: false
jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run brain
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}   # 권장(서버 전용 키, 브라우저 미노출)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 선택(설정 시 gemini 우선)
          GAS_URL:       ${{ secrets.GAS_URL }}         # 선택(사용자 요청 큐)
          BUDGET: '120'
        run: node server_brain.js
      - name: Commit results
        run: |
          git config user.name  "brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add corpus archive/meetings research_log.json USABLE_RULES.md learned_rules.json || true
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "🧠 24h brain $(date -u +%FT%TZ) [skip ci]"
          # 실행 중 다른 커밋이 먼저 올라와도 밀리지 않게: rebase 후 push, 3회 재시도
          for i in 1 2 3; do
            git pull --rebase origin master && git push && exit 0
            echo "push 재시도 $i"; sleep $((i*5))
          done
          echo "push 3회 실패"; exit 1
